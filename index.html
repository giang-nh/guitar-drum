<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Guitar Drum" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Guitar Drum</title>
  <style>
    :root{
      color-scheme:light;
      --bg:#f5f6f7; --card:#fff; --panel:#f8f9fa; --text:#151719; --muted:#6e7379;
      --border:#dfe2e5; --accent:#0a84ff; --accent-bg:#eaf4ff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    button,select,input{font:inherit}
    .app{width:min(980px,100%);margin:0 auto;padding:18px 14px 36px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
    .top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    h1{font-size:28px;line-height:1.1;margin:0 0 8px}
    .sub{color:var(--muted);font-size:16px}
    .bpmBox{min-width:74px;text-align:center;background:var(--panel);border-radius:14px;padding:10px}
    .bpmBox strong{display:block;font-size:28px}.bpmBox span{font-size:12px;color:var(--muted)}
    .songPicker{max-width:430px;margin-bottom:16px}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
    label{display:block;font-weight:650;font-size:14px;margin-bottom:7px}
    select{width:100%;height:46px;border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:0 12px}
    input[type=range]{width:100%;margin-top:10px}
    .playerTop{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .section{font-weight:700}.time{color:var(--muted);font-size:14px;margin-left:6px}
    .beats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:16px 8px 6px;position:relative}
    .beats::before{content:"";position:absolute;left:12.5%;right:12.5%;top:29px;height:2px;background:var(--border);z-index:0}
    .beat{height:48px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;background:transparent;font-weight:750;color:var(--muted);position:relative;z-index:1;pointer-events:none;user-select:none}
    .beat::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--border);box-sizing:border-box}
    .beat.on{color:var(--accent)}
    .beat.on::after{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-bg)}
    .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
    .status{color:var(--muted);font-size:14px}
    .buttons{display:flex;gap:10px}
    button{min-height:46px;border-radius:10px;border:1px solid var(--border);background:var(--card);padding:0 18px;font-weight:750;cursor:pointer}
    button.primary{background:var(--accent-bg);border-color:transparent}
    button:disabled{opacity:.45;cursor:default}
    .sheet{padding:12px 10px}
    .sheetToolbar{display:flex;justify-content:flex-end;margin-bottom:8px}
    .sectionLabel{margin:10px 0 3px 44px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .lineWrap{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:4px}
    .num{text-align:right;padding-right:5px;color:var(--muted);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
    .row{width:100%;display:block;text-align:left;background:transparent;border-radius:8px;padding:6px 8px;font-size:15px;line-height:1.45;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .row:hover{background:var(--panel)}
    .row.active{background:var(--accent-bg);box-shadow:inset 4px 0 0 var(--accent)}
    .lineWrap.active .num{color:var(--accent)}
    .chord{display:inline-block;padding:0 .22em;margin:0 .04em;border:1px solid var(--border);border-radius:5px;background:var(--card);font-size:.88em;line-height:1.28;font-weight:800;white-space:nowrap}
    @media(max-width:800px){.controls{grid-template-columns:1fr 1fr}}
    @media(max-width:700px){
      .app{padding:10px 8px 28px}.card{border-radius:14px;padding:14px}
      h1{font-size:23px}.sub{font-size:14px}.controls{grid-template-columns:1fr;gap:12px}
      .row{font-size:14px;padding:6px 6px}.sectionLabel{margin-left:40px}.lineWrap{grid-template-columns:36px minmax(0,1fr)}
      .buttons button{padding:0 14px}.actions{align-items:flex-end}
    }
    @media(display-mode:standalone){body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}}
  </style>
</head>
<body>
<main class="app">
  <section class="card">
    <div class="songPicker">
      <label for="songSelect">Bài hát</label>
      <select id="songSelect">
        <option value="nang-tho">Nàng Thơ · Hoàng Dũng</option>
        <option value="que-xa">Quê Xa · Quang Dũng</option>
      </select>
    </div>
    <div class="top">
      <div>
        <h1 id="songTitle">Nàng Thơ · Hoàng Dũng</h1>
        <div id="songMeta" class="sub">Ballad · 4/4</div>
      </div>
      <div class="bpmBox"><strong id="bpmLabel">62</strong><span>BPM</span></div>
    </div>
    <div class="controls">
      <div>
        <label for="keySelect">Tone</label>
        <select id="keySelect"></select>
      </div>
      <div>
        <label for="bpm">Tempo</label>
        <input id="bpm" type="range" min="50" max="90" value="62" step="1" />
      </div>
    </div>
  </section>

  <section class="card">
    <div class="playerTop">
      <div><span id="section" class="section">Intro</span><span id="position" class="time">0:00</span></div>
    </div>
    <div class="beats">
      <div class="beat">1</div><div class="beat">2</div><div class="beat">3</div><div class="beat">4</div>
    </div>
    <div class="actions">
      <div id="status" class="status">Sẵn sàng.</div>
      <div class="buttons">
        <button id="toggle" class="primary">▶ Play</button>
        <button id="stop" disabled>■ Stop</button>
      </div>
    </div>
  </section>

  <section class="card sheet">
    <div class="sheetToolbar"><button id="viewToggle">↓ Show all</button></div>
    <div id="sheet"></div>
  </section>
</main>

<script>
(() => {

  const viewBtn=$('#viewToggle');
  const beatEls=[...document.querySelectorAll('.beat')];

  const notes=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  const songs={

        ['Verse 2',6,['C','Mai, rồi em sẽ ','Em7','quên ngày mình khờ ','Am7','dại']],

        ['Final +1 Tone',6,['','Lại trĩu lên tim ta ','A','những vết hằn']],
        ['Final +1 Tone',5,['','Tiếng yêu này mỏng ','D','manh']],
        ['Final +1 Tone',6,['','Giờ tan ','F#m7','vỡ, thôi ','Bm7','cũng đành']],
        ['Final +1 Tone',6,['Am7','Xếp riêng ','D','những ngày ','G','tháng hồn nhiên ','Em7','']],
        ['Final +1 Tone',8,['','Trả ','A','hết cho ','G','em ','A',' ','G',' ','A',' ','G',' ','C',' ','D','']]
      ]
    },
    'que-xa':{
      title:'Quê Xa',artist:'Quang Dũng',meta:'Ballad · 4/4 · tone gốc D/Dm',baseKey:2,defaultBpm:62,preferFlats:true,
      rows:[
        ['Verse 1',8,['','Bỗng ','D',' dưng thấy đời buồn thiu không ','Em7b5','mê xem phim chán ','D/A','cà phê chiều']],
        ['Verse 1',8,['','Gió ','Gm',' mang nỗi buồn quạnh ','Em7b5','hiu gửi chút thương ','Bb',' yêu về nơi tôi ','A7',' nhớ']],
        ['Verse 1',8,['','Tối ','D',' qua tôi nằm ngủ ','Am/C','mơ, trong cơn ','Em7b5',' mơ tôi thấy tôi ','D/A',' xa đời']],

        ['Verse 2',8,['','Đúng ','Gm',' ra đó là chuyện ','Em7b5','vui thầm chúc cho ','Bb',' em niềm vui duyên ','A7',' mới']],
        ['Verse 2',8,['','Chắc ','D',' tôi sẽ ở vậy ','Am/C','thôi xa quê bao ','Em7b5',' năm đã lâu lắm ','D/A',' rồi']],
        ['Verse 2',8,['','Có ','Gm',' đâu dám về lại ','Em7b5','thăm thà nhớ thương ','Bb',' thôi chứ về buồn ','A7',' lắm !']],
        ['Verse 2',8,['','Có ','Gm',' khi cách trở mà ','Eb','hay bên nhau ','Cm',' không vui sống xa nhớ ','Gm',' nhiều']],
        ['Verse 2',8,['','Tôi ','Am7',' thôi cứ là vậy ','D/A','thôi vậy thôi tôi ','E7',' nhé nhớ nhau vậy ','A',' thôi']],
        ['Điệp khúc 2',8,['','Gió ','Gm',' ơi nhắn gửi dùm tôi, tôi xa quê ','Cm',' tôi đã bao năm ','Gm',' rồi']],
        ['Điệp khúc 2',8,['','Biết ','Am7',' em có còn là ','D/A','quê? Miền quê xa ','E7',' đó có bao buồn ','A',' vui']],
        ['Verse 3',8,['','Sáng ','D',' nay có người bảo tôi nghe đâu sang ','Em7b5',' năm chắc em ','D/A',' lấy chồng']],
        ['Verse 3',8,['','Đúng ','Gm',' ra đó là chuyện ','Em7b5','vui thầm chúc cho ','Bb',' em niềm vui duyên ','A7',' mới']],
        ['Verse 3',8,['','Chắc ','D',' tôi sẽ ở vậy ','Am/C','thôi xa quê bao ','Gm',' năm đã lâu lắm ','D/A',' rồi']],
        ['Verse 3',8,['','Có ','Gm',' đâu dám về lại ','Em7b5','thăm thà nhớ thương ','Bb',' thôi chứ về buồn ','A7',' lắm !']],
        ['Verse 3',8,['','Có ','Gm',' khi cách trở mà ','Eb','hay bên nhau ','Cm',' không vui sống xa nhớ ','Gm',' nhiều']],
        ['Verse 3',8,['','Tôi ','Am7',' thôi cứ là vậy ','D/A','thôi vậy thôi tôi ','E7',' nhé nhớ nhau vậy ','A',' thôi']],
        ['Outro',8,['','Tối ','D',' qua tôi lại nằm mơ, trong cơn ','Em7b5',' mơ tôi thấy tôi ','D/A',' xa đời']],
        ['Outro',8,['','Quá ','Gm',' nhanh có kịp chào ','Em7b5','ai chào mỗi em ','Bb',' thôi ','A','cách xa nghìn ','Dm',' trùng']],
        ['Outro',8,['','Quá ','Gm',' nhanh có kịp chào ','Em7b5','ai chào mỗi quê ','Bb',' thôi ','A','đã xa nghìn ','Dm',' trùng']],
        ['Outro',8,['','ứ... ','Gm',' ư.... ứ ứ....ư.... chào mỗi em ','Bb',' thôi cách ','A7',' xa nghìn ','Dm',' trùng']]
      ]
    }

  let songId='nang-tho', song=songs[songId], rows=[], total=0, shift=0, currentRow=0, showAll=false;

  function stateKey(id){return STORAGE_KEY+'-'+id}
  function loadState(id){
    try{return JSON.parse(localStorage.getItem(stateKey(id))||'{}')}catch{return {}}
  }
  function saveState(){
    try{
      localStorage.setItem(stateKey(songId),JSON.stringify({
        row:currentRow,key:keySel.value,bpm:bpm.value,showAll
      }));
      localStorage.setItem(STORAGE_KEY+'-last-song',songId);
    }catch{}
  }

  function buildRows(){
    rows=[]; total=0;
    song.rows.forEach((d,i)=>{const r={s:d[0],b:d[1],parts:d[2],start:total,i};total+=r.b;r.end=total;rows.push(r)});
  }

  const toneHints={
    10:'nam trầm / nữ cao',
    11:'nam trầm–trung / nữ cao',
    0:'nam trung',
    1:'nam trung–cao',
    2:'nam cao',
    5:'nữ trầm',
    6:'nữ trầm–trung',
    7:'nữ trung',
    8:'nữ trung',
    9:'nữ trung–cao'
  };

  function populateKeys(target){
    keySel.innerHTML='';
    const displayNotes=song.preferFlats?notesFlat:notes;
    displayNotes.forEach((n,i)=>{
      const o=document.createElement('option');
      o.value=String(i);
      const bits=[n];
      if(i===song.baseKey)bits.push('tone gốc');
      if(toneHints[i])bits.push(toneHints[i]);
      o.textContent=bits.join(' · ');
      if(i===target)o.selected=true;
      keySel.appendChild(o);
    });
  }

  function transposeChord(ch){
    const m=ch.match(/^([A-G])([#b]?)(.*)$/); if(!m) return ch;
    const n=noteMap[m[1]+m[2]]; if(n===undefined) return ch;
    const outNotes=song.preferFlats?notesFlat:notes;
    return outNotes[(n+shift+12)%12]+m[3];
  }
  function isChord(v){return /^[A-G](?:#|b)?(?:m|maj|dim|aug|sus|add)?\d*(?:b5|#5|b9|#9|11|13)?(?:\/[A-G](?:#|b)?)?$/.test(v)}
  function renderParts(parts){return parts.map(v=>isChord(v)?'<span class="chord">'+transposeChord(v)+'</span>':v).join('')}

  function renderSheet(){
    sheet.innerHTML='';
    let indices=[];
    if(showAll) indices=rows.map((_,i)=>i);
    else{
      let start=Math.max(0,currentRow-2),end=Math.min(rows.length,start+5);
      start=Math.max(0,end-5);for(let i=start;i<end;i++)indices.push(i);
    }
    let prev=null;
    indices.forEach(i=>{
      const r=rows[i];
      if(r.s!==prev){const h=document.createElement('div');h.className='sectionLabel';h.textContent=r.s;sheet.appendChild(h);prev=r.s}
      const wrap=document.createElement('div');wrap.className='lineWrap'+(i===currentRow?' active':'');
      const num=document.createElement('div');num.className='num';num.textContent=(i+1)+'.';
      const row=document.createElement('div');row.className='row'+(i===currentRow?' active':'');row.innerHTML=renderParts(r.parts);
      row.setAttribute('role','button');row.setAttribute('tabindex','0');row.setAttribute('aria-label','Nhảy tới dòng '+(i+1));
      row.addEventListener('click',()=>jumpToRow(i));
      row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();jumpToRow(i)}});
      wrap.append(num,row);sheet.appendChild(wrap);
    });
    viewBtn.textContent=showAll?'↑ Show 5 lines':'↓ Show all';
  }

  function updateTime(){const sec=Math.round(songBeat*60/Number(bpm.value));position.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
  function updateRow(i){currentRow=Math.max(0,Math.min(rows.length-1,i));sectionLabel.textContent=rows[currentRow].s;renderSheet();saveState()}
  function jumpToRow(i){songBeat=rows[i].start;updateRow(i);updateTime();status.textContent=playing&&!paused?'Đã nhảy tới Line '+(i+1)+'.':'Sẵn sàng từ Line '+(i+1)+'.';if(playing&&!paused){nextTime=ctx.currentTime+.08;quarter=songBeat%4}}
  function changeKey(){shift=(Number(keySel.value)-song.baseKey+12)%12;renderSheet();saveState()}

  function loadSong(id,resetAudio=true){
    if(resetAudio) stopPlaybackOnly();
    songId=id;song=songs[id];songSel.value=id;
    buildRows();
    const saved=loadState(id);
    const targetKey=saved.key!=null?Number(saved.key):song.baseKey;
    populateKeys(targetKey);
    bpm.value=saved.bpm!=null?String(saved.bpm):String(song.defaultBpm);
    bpmLabel.textContent=bpm.value;
    showAll=Boolean(saved.showAll);
    currentRow=Math.max(0,Math.min(rows.length-1,Number(saved.row)||0));
    shift=(Number(keySel.value)-song.baseKey+12)%12;
    songBeat=rows[currentRow].start;
    quarter=songBeat%4;countIn=4;
    titleEl.textContent=song.title+' · '+song.artist;
    metaEl.textContent=song.meta;
    document.title=song.title+' · Guitar Drum';
    sectionLabel.textContent=rows[currentRow].s;
    updateTime();
    status.textContent=currentRow===0?'Sẵn sàng.':'Sẵn sàng từ Line '+(currentRow+1)+'.';
    renderSheet();
    saveState();
  }

  let ctx=null,master=null,noise=null,timer=null,playing=false,paused=false,nextTime=0,quarter=0,countIn=4,songBeat=0,visualTimers=[];

  function setup(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();master=ctx.createGain();master.gain.value=.7;master.connect(ctx.destination);
      noise=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.25),ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    return ctx.state==='suspended'?ctx.resume():Promise.resolve();
  }
  function kick(t,p=1){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(118,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.65*p,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(master);o.start(t);o.stop(t+.21)}
  function snare(t,p=1){const s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noise;hp.type='highpass';hp.frequency.value=1100;g.gain.setValueAtTime(.24*p,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);s.connect(hp);hp.connect(g);g.connect(master);s.start(t);s.stop(t+.14)}
  function hat(t,p=1){const s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noise;hp.type='highpass';hp.frequency.value=6500;g.gain.setValueAtTime(.05*p,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);s.connect(hp);hp.connect(g);g.connect(master);s.start(t);s.stop(t+.05)}
  function click(t,strong){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=strong?1050:820;g.gain.setValueAtTime(strong?.15:.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(g);g.connect(master);o.start(t);o.stop(t+.05)}
  function rowForBeat(b){for(let i=0;i<rows.length;i++)if(b>=rows[i].start&&b<rows[i].end)return i;return rows.length-1}

  function visualBeat(beat,t,isCount){
    const delay=Math.max(0,(t-ctx.currentTime)*1000);
    visualTimers.push(setTimeout(()=>{
      if(!playing||paused)return;
      beatEls.forEach((el,i)=>el.classList.toggle('on',i===beat));
      if(isCount)status.textContent='Count-in: '+(beat+1);
      else{
        const next=rowForBeat(songBeat);if(next!==currentRow)updateRow(next);
        updateTime();status.textContent='Line '+(currentRow+1)+' · Beat '+(beat+1);songBeat++;
        if(songBeat>=total)stopToBeginning();
      }
    },delay));
  }
  function scheduleBeat(t){
    const beat=quarter%4;
    if(countIn>0){click(t,beat===0);visualBeat(beat,t,true);countIn--;quarter++;return}
    const q=60/Number(bpm.value);hat(t,1);hat(t+q/2,.55);if(beat===0)kick(t,.95);if(beat===1||beat===3)snare(t,.85);if(beat===2)kick(t,.65);visualBeat(beat,t,false);quarter++;
  }
  function tick(){if(!playing||paused)return;const q=60/Math.max(50,Math.min(90,Number(bpm.value)||62));while(nextTime<ctx.currentTime+.12){scheduleBeat(nextTime);nextTime+=q}}

  async function toggle(){
    await setup();
    if(!playing){playing=true;paused=false;countIn=4;quarter=songBeat%4;nextTime=ctx.currentTime+.08;toggleBtn.textContent='Ⅱ Pause';stopBtn.disabled=false;status.textContent='Chuẩn bị…';tick();timer=setInterval(tick,25);return}
    if(!paused){paused=true;toggleBtn.textContent='▶ Play';status.textContent='Đã pause ở Line '+(currentRow+1)+'.';visualTimers.forEach(clearTimeout);visualTimers=[];return}
    paused=false;nextTime=ctx.currentTime+.08;toggleBtn.textContent='Ⅱ Pause';status.textContent='Tiếp tục Line '+(currentRow+1)+'…';
  }

  function stopPlaybackOnly(){
    playing=false;paused=false;if(timer)clearInterval(timer);timer=null;visualTimers.forEach(clearTimeout);visualTimers=[];
    toggleBtn.textContent='▶ Play';stopBtn.disabled=true;beatEls.forEach(el=>el.classList.remove('on'));
  }

  function stopToBeginning(){
    stopPlaybackOnly();
    songBeat=0;quarter=0;countIn=4;currentRow=0;position.textContent='0:00';sectionLabel.textContent=rows[0].s;
    status.textContent='Đã dừng · trở về đầu bài.';renderSheet();saveState();
  }

  songSel.addEventListener('change',()=>loadSong(songSel.value,true));
  viewBtn.addEventListener('click',()=>{showAll=!showAll;renderSheet();saveState()});
  keySel.addEventListener('change',changeKey);
  bpm.addEventListener('input',()=>{bpmLabel.textContent=bpm.value;saveState()});
  toggleBtn.addEventListener('click',toggle);
  stopBtn.addEventListener('click',stopToBeginning);

  const lastSong=localStorage.getItem(STORAGE_KEY+'-last-song');
  loadSong(songs[lastSong]?lastSong:'nang-tho',false);

  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>

name: Automated tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run automated logic tests
        run: node tests/run-tests.cjs
